name: Quant research checks

on:
  pull_request:
  push:
    branches:
      - main
      - feat/eth-volatility-forecasting

permissions:
  contents: read

jobs:
  volatility-research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install focused research and API dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26" "scipy>=1.12" "pytest>=8" "pytest-cov>=4.1" "fastapi>=0.110,<1" "uvicorn[standard]>=0.27,<1"
      - name: Test volatility models and market-data contracts
        run: |
          python -m pytest -q \
            tests/unit/test_volatility_forecasting.py \
            tests/unit/test_market_data_providers.py
      - name: Verify API and worker imports
        run: |
          python -c "from src.api.app import app; assert app.title == 'ETH Volatility Intelligence API'"
          python -c "import scripts.run_volatility_cycle"
          python -m compileall -q src scripts
