name: Quant research checks

on:
  pull_request:
  push:
    branches:
      - main
      - feat/eth-volatility-forecasting

permissions:
  contents: read

jobs:
  volatility-research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install focused research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26" "scipy>=1.12" "pytest>=8" "pytest-cov>=4.1"
      - name: Test volatility models and market-data contracts
        run: |
          python -m pytest -q \
            tests/unit/test_volatility_forecasting.py \
            tests/unit/test_market_data_providers.py
