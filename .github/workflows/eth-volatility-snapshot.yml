name: ETH/USD hourly volatility snapshot

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eth-volatility-snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install forecasting dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-quant.txt
      - name: Fetch market data and fit volatility models
        run: python scripts/export_volatility_snapshot.py --output-dir artifacts/volatility
      - name: Commit the versioned snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/volatility/latest.json artifacts/volatility/history.jsonl
          if git diff --cached --quiet; then
            echo "Snapshot is unchanged; no commit required."
          else
            git commit -m "chore(data): refresh ETH/USD volatility snapshot"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
