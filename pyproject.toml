[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "institutional-quant-engine"
version = "0.1.0"
description = "Institutional Quantitative Portfolio Engine"
authors = ["Quantitative Systems Architect"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
polars = "^1.0.0"
pyarrow = "^15.0.0"
duckdb = "^1.0.0"
cvxpy = "^1.5.0"
scipy = "^1.12.0"
xgboost = "^2.0.0"
scikit-learn = "^1.4.0"
torch = "^2.2.0"
numpy = "^1.26.0"
pydantic = "^2.6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^4.1.0"
hypothesis = "^6.98.0"
mypy = "^1.8.0"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=src --cov-report=term-missing"
testpaths = [
    "tests",
]
pythonpath = ["."]
