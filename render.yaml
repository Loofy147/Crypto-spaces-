# Render Blueprint for the ETH volatility API and hourly research cycle.
# Syncing this Blueprint creates billable services and a managed PostgreSQL
# database. Review the plans/costs in Render before confirming resource creation.

services:
  - type: web
    name: eth-volatility-api
    runtime: python
    region: frankfurt
    plan: 0.5c-512mb
    branch: feat/eth-volatility-forecasting
    buildCommand: pip install -r requirements-api.txt
    preDeployCommand: python scripts/init_database.py
    startCommand: uvicorn src.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eth-volatility-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false

  - type: cron
    name: eth-volatility-hourly
    runtime: python
    region: frankfurt
    plan: 0.5c-512mb
    branch: feat/eth-volatility-forecasting
    schedule: "5 * * * *"
    buildCommand: pip install -r requirements-api.txt
    startCommand: python scripts/run_volatility_cycle.py
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eth-volatility-db
          property: connectionString

databases:
  - name: eth-volatility-db
    region: frankfurt
    plan: basic_256mb
    postgresMajorVersion: "18"
    databaseName: eth_volatility
    user: eth_volatility
